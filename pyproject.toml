[project]
name = "crossplane-compass"
version = "0.1.0"
description = "Evidence-first Crossplane MCP: discover, diagnose, trace, validate, and plan GitOps changes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Crossplane Compass contributors"}]
keywords = ["crossplane", "mcp", "kubernetes", "gitops"]
dependencies = ["mcp>=1.30,<2", "kubernetes>=36,<37", "PyYAML>=6,<7", "jsonschema>=4,<5"]
[project.scripts]
crossplane-compass = "crossplane_compass.server:main"
[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6", "ruff>=0.14", "build>=1", "pip-audit>=2"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.coverage.run]
source = ["crossplane_compass"]
