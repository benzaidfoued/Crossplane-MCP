{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compass.fullname" . }}
spec:
  podSelector:
    matchLabels: {{- include "compass.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.clientPodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports:
        {{- range .Values.networkPolicy.apiPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
